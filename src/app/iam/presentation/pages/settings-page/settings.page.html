<main class="settings" aria-labelledby="settings-title">
  <div class="settings__page">
    <header class="settings__header">
      <button
        matIconButton
        type="button"
        class="settings__back"
        aria-label="Volver"
        (click)="goBack()"
      >
        <mat-icon aria-hidden="true">arrow_back</mat-icon>
      </button>
      <div class="settings__heading">
        <h1 id="settings-title" class="settings__title">Configuración</h1>
      </div>
    </header>

    <section class="settings__card" aria-labelledby="settings-account-title">
      <h2 id="settings-account-title" class="settings__card-title">Tu cuenta</h2>
      <dl class="settings__identity">
        <div class="settings__field">
          <dt class="settings__label">Nombre</dt>
          <dd class="settings__value settings__value--name">
            <span class="settings__name">{{ userName() }}</span>
            <button
              matIconButton
              type="button"
              class="settings__edit"
              aria-label="Editar nombre y apellido"
              (click)="openProfileDialog()"
            >
              <mat-icon aria-hidden="true">edit</mat-icon>
            </button>
          </dd>
        </div>
        <div class="settings__field">
          <dt class="settings__label">Correo electrónico</dt>
          <dd class="settings__value">{{ userEmail() }}</dd>
        </div>
      </dl>
    </section>

    <section class="settings__card" aria-labelledby="settings-session-title">
      <h2 id="settings-session-title" class="settings__card-title">Sesión</h2>
      <p class="settings__copy">
        Cierra la sesión de este navegador. Tendrás que volver a iniciar sesión para entrar de
        nuevo.
      </p>
      <button
        matButton="filled"
        class="settings__logout"
        type="button"
        [disabled]="closing()"
        (click)="logout()"
      >
        {{ closing() ? 'Cerrando sesión…' : 'Cerrar sesión' }}
      </button>
    </section>
  </div>
</main>
