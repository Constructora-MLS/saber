<header class="credential-header">
  <div class="credential-header__inner">
    <div class="credential-header__brand">
      <app-mls-icon class="credential-header__logo" size="2.5rem" label="Constructora MLS" />
      <span class="credential-header__company">{{ company() }}</span>
    </div>

    <div class="credential-header__copy">
      <h1 class="credential-header__title">{{ title() }}</h1>
      <p class="credential-header__subtitle">{{ subtitle() }}</p>
    </div>
  </div>
</header>
